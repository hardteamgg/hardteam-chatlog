<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Chatlog GTA RP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="script.js" defer></script>
</head>
<body class="fade-in">

    <h1>Hard Team | Chatlog Generator</h1>

    <div class="container">
        <div class="editor">
            
            <div id="characters-container" style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center;">
                <!-- Characters will be generated by JS -->
                <div id="action-buttons-char" style="display: flex; gap: 5px;">
                    <button id="btn-add-char" class="tool-btn" onclick="addCharacter()" style="border-color: #2ea043; color: #33cc33;" title="Adiciona um novo slot de personagem">
                        + Adicionar Personagem
                    </button>
                    <button class="tool-btn" onclick="openManagerModal()" style="border-color: #8b949e; color: #c9d1d9;" title="Excluir ou editar personagens existentes">
                        ⚙️ Gerenciar Personagens
                    </button>
                </div>
            </div>

            <div class="toolbar">
                <button class="tool-btn btn-info" onclick="insertTag('[INFO] ')" title="Mensagem de Informação (Azul)">ℹ️ [INFO]</button>
                <button class="tool-btn btn-fala" onclick="insertTag('fala')" title="Insere a fala do personagem ativo no momento">💬 FALA</button>
                <button class="tool-btn btn-me" onclick="insertTag('* ')" title="Ação de personagem (* ou /me)">★ * AÇÃO</button>
                <button class="tool-btn btn-item" onclick="insertTag('$ ')" title="Pegar/Entregar item ($ ou /item)">$ ITEM</button>
                <button class="tool-btn btn-cel" onclick="insertTag('# ')" title="Mensagem de Celular (# ou /cel)"># CEL</button>
                <button class="tool-btn btn-sis" onclick="insertTag('! ')" title="Sistema ou Anúncio (! ou /sis)">! SIS</button>
                <button class="tool-btn btn-ooc" onclick="insertTag('(( ')" title="Chat fora do personagem (OOC)">(( OOC</button>
                <button class="tool-btn" onclick="insertTimestamp()" style="color: #FFD700; border-color: #4d4000;" title="Adiciona horário customizado ou automático [HH:MM]">⏱️ HORA</button>
                <button class="tool-btn" onclick="clearAll()" style="color: #da3633; border-color: #b32d2a;" title="Apaga tudo">🗑️ LIMPAR TUDO</button>
            </div>

            <div class="style-panel">
                <div class="style-header">
                    <div class="yellow-indicator"></div>
                    <span>ESTILO E POSICIONAMENTO</span>
                </div>
                
                <div class="style-grid">
                    <div style="display: flex; flex-direction: column; gap: 15px;">
                        <div class="style-item">
                            <div class="style-labels">
                                <label>TAMANHO DA FONTE</label>
                                <span id="lbl-font" class="highlight-val">15px</span>
                            </div>
                            <div class="slider-row">
                                <button class="sq-btn" onclick="adjustSlider('range-font', -1)">-</button>
                                <input type="range" id="range-font" min="10" max="30" value="15" oninput="applyStyles()">
                                <button class="sq-btn" onclick="adjustSlider('range-font', 1)">+</button>
                            </div>
                        </div>

                        <div class="style-item">
                            <div class="style-labels">
                                <label>LARGURA DO BLOCO</label>
                                <span id="lbl-width" class="highlight-val">100%</span>
                            </div>
                            <input type="range" id="range-width" min="20" max="100" value="100" oninput="applyStyles()">
                        </div>

                        <div class="style-item">
                            <div class="style-labels">
                                <label>MARGEM INTERNA (PADDING)</label>
                                <span id="lbl-padding" class="highlight-val">15px</span>
                            </div>
                            <div class="slider-row">
                                <input type="range" id="range-padding" min="0" max="50" value="15" oninput="applyStyles()">
                            </div>
                        </div>
                    </div>

                    <div style="display: flex; flex-direction: column; gap: 15px;">
                        <div class="style-item">
                            <div class="style-labels">
                                <label>FUNDO DO TEXTO</label>
                                <label class="checkbox-label">
                                    <input type="checkbox" id="check-bg" onchange="applyStyles()"> ATIVO
                                </label>
                            </div>
                            <div class="slider-row" style="margin-top: 5px;">
                                <input type="color" id="color-bg" class="color-picker" value="#000000" oninput="applyStyles()">
                                <input type="range" id="range-bg-op" min="0" max="100" value="70" oninput="applyStyles()">
                                <span id="lbl-bg-op" class="highlight-val" style="font-size: 11px;">70%</span>
                            </div>
                        </div>

                        <div class="style-item">
                            <div class="style-labels">
                                <label>TEXTO (Opacidade / Sombra)</label>
                                <span id="lbl-text-op" class="highlight-val">100%</span>
                            </div>
                            <div class="slider-row">
                                <span style="font-size: 10px; color: #8b949e;">OPC</span>
                                <input type="range" id="range-text-op" min="10" max="100" value="100" oninput="applyStyles()">
                            </div>
                            <div class="slider-row" style="margin-top: 5px;">
                                <span style="font-size: 10px; color: #8b949e;">SMB</span>
                                <input type="range" id="range-shadow" min="0" max="3" value="1" oninput="applyStyles()">
                            </div>
                        </div>

                        <div class="style-item">
                            <div class="style-labels">
                                <label>ALINHAMENTO DO TEXTO</label>
                            </div>
                            <div class="slider-row" style="margin-top: 5px; gap: 5px;">
                                <button class="sq-btn align-btn" id="btn-align-left" onclick="setAlignment('left')" style="width: auto; padding: 0 10px; background-color: #30363d;">Esquerda</button>
                                <button class="sq-btn align-btn" id="btn-align-center" onclick="setAlignment('center')" style="width: auto; padding: 0 10px;">Centro</button>
                                <button class="sq-btn align-btn" id="btn-align-right" onclick="setAlignment('right')" style="width: auto; padding: 0 10px;">Direita</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <textarea id="chat-input" placeholder="Seu log aparecerá aqui..."></textarea>
            <button class="download-btn" onclick="downloadImage()">Baixar PNG Transparente</button>
        </div>

        <div class="preview-section">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h3 style="margin:0; color:#8b949e;">Visualização:</h3>
                <div style="display: flex; gap: 10px;">
                    <input type="file" id="bg-upload" accept="image/*" style="display:none;" onchange="loadTestBackground(event)">
                    <button class="tool-btn" onclick="document.getElementById('bg-upload').click()" title="Escolha uma imagem de fundo para testar o visual" style="padding: 5px 10px;">🖼️ Testar Imagem de Fundo</button>
                    <button class="tool-btn" id="btn-clear-bg" onclick="clearTestBackground()" style="display:none; color: var(--danger); padding: 5px 10px;">❌ Remover Imagem</button>
                </div>
            </div>
            
            <div class="preview-bg" id="preview-container">
                <div id="render-box"></div>
            </div>
            <p style="font-size: 11px; color: #8b949e; margin-top: 5px;">Nota: A imagem de fundo é apenas para teste e <strong>não</strong> será exportada no PNG final.</p>
        </div>
    </div>

    <div id="manager-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Gerenciar Personagens</h2>
                <span class="close-btn" onclick="closeManagerModal()">&times;</span>
            </div>
            <div id="modal-char-list"></div>
        </div>
    </div>
</body>
</html>
